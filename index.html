<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fichas ANS</title>
<meta name="description" content="Fichas de clientes para venda a prazo e porta a porta.">
<meta name="theme-color" content="#1E3B2E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Identidade ANS — verde escuro predominante, dourado só em destaques, branco e cinza claro de fundo. Coluna única (máx. 760px), navegação inferior. */
:root {
  --bg: #F5F5F3; --surface: #FFFFFF; --surface-2: #F5F5F3; --ink: #1E3B2E; --muted: #5E6F66; --line: #E3E4DF;
  --accent: #1E3B2E; --accent-ink: #FFFFFF; --accent-soft: #E6ECE8; --sun: #B6974A; --sun-ink: #1E3B2E;
  --hero-bg: #1E3B2E; --hero-ink: #FFFFFF;
  --danger: #9E2B25; --danger-soft: #F6E4E2; --warn: #7E6424; --warn-soft: #F3EEDF;
  --shadow: 0 1px 2px rgba(30,59,46,.05), 0 4px 16px rgba(30,59,46,.05);
  --f: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #10201A; --surface: #1A3428; --surface-2: #163024; --ink: #FFFFFF; --muted: #A9B8AF; --line: #2C4A3C;
    --accent: #B6974A; --accent-ink: #10201A; --accent-soft: #2A4537; --sun: #B6974A; --sun-ink: #10201A;
    --hero-bg: #1E3B2E; --hero-ink: #FFFFFF;
    --danger: #F08A80; --danger-soft: #3A2220; --warn: #D6BC7A; --warn-soft: #33301F;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--hero-bg); }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.15; font-weight: 800; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--hero-bg); color: var(--hero-ink); }
.top-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.logo { height: 46px; width: auto; display: block; max-width: 62vw; object-fit: contain; }
.sync { margin-left: auto; font-size: 12px; color: var(--hero-ink); opacity: .8; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.ok { background: var(--hero-ink); } .dot.wait { background: var(--sun); } .dot.err { background: var(--danger); }

main { max-width: 760px; margin: 0 auto; padding-top: 18px; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabs-in { max-width: 760px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
.tab { background: none; border: 0; padding: 10px 4px 12px; display: grid; justify-items: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab[aria-current="page"] svg { stroke-width: 2.4; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.sun { background: var(--sun); border-color: var(--sun); color: var(--sun-ink); }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn.danger.armed { background: var(--danger); color: var(--surface); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.link { border: 0; background: none; min-height: 0; padding: 4px; color: var(--accent); text-decoration: underline; }
.btn.sm { min-height: 34px; padding: 6px 10px; font-size: 13px; border-radius: 10px; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn[disabled] { opacity: .5; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grow { flex: 1 1 auto; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.pad { padding: 16px; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); } .small { font-size: 13px; }
.page-h { font-size: 26px; }

.today h1 { font-size: 28px; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 620px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.stat { padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 2px; }
.stat b { font-size: 20px; font-variant-numeric: tabular-nums; }
.stat.hot b { color: var(--danger); } .stat.good b { color: var(--accent); }

.section { display: grid; gap: 8px; }
.section-h { display: flex; align-items: baseline; gap: 8px; }
.section-h h2 { font-size: 18px; }
.count { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); }
.count.hot { background: var(--danger-soft); border-color: transparent; color: var(--danger); }

.list { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.item { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; cursor: pointer; width: 100%; }
.item:first-child { border-top: 0; }
.item:hover { background: var(--surface-2); }
.item .who { min-width: 0; }
.item .who b { display: block; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .who span { display: block; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.item .val small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
.fno { width: 42px; height: 42px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; font-weight: 800; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.fno.late { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
.fno.today { background: var(--sun); border-color: transparent; color: var(--sun-ink); }

.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.pill.ok { background: var(--accent-soft); color: var(--accent); }
.pill.late { background: var(--danger-soft); color: var(--danger); }
.pill.part { background: var(--warn-soft); color: var(--warn); }
.pill.open { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }

.input, select.input, textarea.input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 12px; min-height: 46px; }
textarea.input { min-height: 72px; resize: vertical; }
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 99px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.empty { text-align: center; padding: 28px 18px; display: grid; gap: 10px; justify-items: center; }
.empty h3 { font-size: 18px; }
.empty p { margin: 0; color: var(--muted); max-width: 42ch; }
.steps { text-align: left; margin: 4px 0 0; padding-left: 20px; color: var(--muted); display: grid; gap: 4px; }

.ficha { position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--sun); border-radius: var(--r); box-shadow: var(--shadow); }
.ficha-in { padding: 16px; display: grid; gap: 10px; }
.stamp { position: absolute; top: 14px; right: 14px; border: 1.5px solid var(--sun); color: var(--sun); padding: 3px 9px; border-radius: 8px; font-weight: 800; font-size: 13px; letter-spacing: .04em; background: var(--surface); }
.ficha h1 { font-size: 26px; padding-right: 110px; }
.kv { display: grid; grid-template-columns: 22px minmax(0,1fr); gap: 8px; align-items: start; line-height: 32px; }
.kv svg { width: 18px; height: 18px; margin-top: 7px; color: var(--muted); }
.kv div { min-width: 0; overflow-wrap: anywhere; }
.balance { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px; align-items: end; padding: 16px; border-radius: var(--r); background: var(--hero-bg); color: var(--hero-ink); border: 1px solid var(--line); }
.balance .big { font-weight: 800; font-size: 34px; font-variant-numeric: tabular-nums; line-height: 1; }
.balance .lbl { font-size: 12px; opacity: .75; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; }
.balance .side { text-align: right; font-size: 13px; display: grid; gap: 2px; }
.balance .side b { font-variant-numeric: tabular-nums; }
.balance .late { color: var(--sun); }
.actions { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.actions .btn { flex-direction: column; gap: 4px; font-size: 13px; min-height: 64px; }
.actions .btn svg { width: 22px; height: 22px; }
.visit { display: flex; align-items: center; gap: 12px; padding: 12px 14px; flex-wrap: wrap; }
.visit .when { font-weight: 800; font-size: 18px; }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 10px 14px; border-bottom: 1px solid var(--line); }
td { padding: 10px 14px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
@media (max-width: 480px) { th, td { padding: 9px 8px; font-size: 13px; } th:first-child, td:first-child { padding-left: 12px; } th:last-child, td:last-child { padding-right: 12px; } }

.tl { display: grid; }
.ev { display: grid; grid-template-columns: 34px minmax(0,1fr) auto; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); align-items: start; }
.ev:first-child { border-top: 0; }
.ev .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; }
.ev .ic svg { width: 18px; height: 18px; }
.ev.buy .ic { background: var(--warn-soft); color: var(--warn); }
.ev.pay .ic { background: var(--accent-soft); color: var(--accent); }
.ev .body { min-width: 0; }
.ev .body ul { margin: 4px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--muted); display: grid; gap: 1px; }
.ev .amt { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; display: grid; gap: 4px; justify-items: end; }
.ev.pay .amt span { color: var(--accent); }

.sheet-back { position: fixed; inset: 0; z-index: 40; background: rgba(16,32,26,.5); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 640px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px)); overflow: auto; border-radius: 20px 20px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.25); }
@media (min-width: 680px) { .sheet-back { align-items: center; } .sheet { border-radius: 20px; max-height: 90%; } }
.sheet-h { position: sticky; top: 0; z-index: 2; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
.sheet-h h2 { font-size: 19px; }
.sheet-b { padding: 16px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; align-content: start; }
.field { display: grid; gap: 5px; min-width: 0; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
.line-item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 8px; }
.line-item .li-row { display: grid; grid-template-columns: minmax(0,1.4fr) minmax(0,1fr); gap: 8px; }
.line-item .li-row3 { display: grid; grid-template-columns: 72px minmax(0,1fr) 84px; gap: 8px; }
.li-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 34px; }
.li-sub { font-variant-numeric: tabular-nums; font-weight: 700; }
.ev-btns { grid-column: 2 / -1; display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.summary .tot { display: flex; justify-content: space-between; font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; }
.summary .ln { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; font-variant-numeric: tabular-nums; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.err-msg { color: var(--danger); font-size: 13px; font-weight: 600; }
.ok-msg { color: var(--accent); font-size: 13px; font-weight: 600; }
.check { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; min-height: 44px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px); }

/* telas de acesso */
.auth { max-width: 420px; width: 100%; margin: 0 auto; display: grid; gap: 18px; padding-top: 4vh; }
.auth-hero { display: grid; gap: 6px; }
.auth-hero h1 { font-size: 30px; }
.auth-hero p { margin: 0; color: var(--muted); }
.auth form { display: grid; gap: 12px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.seg button { border: 0; background: none; padding: 9px; border-radius: 9px; font-weight: 700; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.pix { display: grid; gap: 8px; padding: 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
.pix code { font-size: 16px; font-weight: 700; overflow-wrap: anywhere; user-select: all; }

@media (max-width: 420px) { .ficha h1 { font-size: 22px; } .balance .big { font-size: 28px; } }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } } }
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <img class="logo" id="logo" alt="ANS Sacolão e Utilidades" width="471" height="153" src="logo.png">
    <div class="sync" id="sync"></div>
  </div>
</header>

<main id="app" aria-live="polite">
  <div class="card empty"><h3>Abrindo…</h3></div>
</main>

<nav class="tabs" id="tabs" aria-label="Seções" hidden>
  <div class="tabs-in">
    <button class="tab" data-tab="hoje" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 3v3M16 3v3"/><circle cx="12" cy="15" r="2"/></svg>
      Visitas
    </button>
    <button class="tab" data-tab="clientes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="11" r="2.2"/><path d="M5.8 16c.6-1.6 1.8-2.4 3.2-2.4s2.6.8 3.2 2.4M14.5 10h4M14.5 13.5h3"/></svg>
      Clientes
    </button>
    <button class="tab" data-tab="produtos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.3 11a2 2 0 0 1-2 1.8H8.3a2 2 0 0 1-2-1.8L5 8Z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
      Produtos
    </button>
    <button class="tab" data-tab="conta">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1.2-3.6 3.8-5.5 7-5.5s5.8 1.9 7 5.5"/></svg>
      Conta
    </button>
  </div>
</nav>

<div id="sheet-root"></div>
<div id="toast-root"></div>

<script src="vendor/supabase.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="config.js"></script>

function resumo(c) {
  const compras = c.compras || [], pagamentos = c.pagamentos || [];
  const total = compras.reduce((s, v) => s + (v.total || 0), 0);
  const pago = pagamentos.reduce((s, p) => s + (p.valor || 0), 0);
  const saldo = Math.max(0, total - pago);
  const hoje = today();
  const parcelas = compras.flatMap(v => (v.parcelas || []).map(p => ({ ...p, vendaId: v.id, vendaData: v.data })))
    .sort((a, b) => a.venc.localeCompare(b.venc) || a.vendaData.localeCompare(b.vendaData));
  let resto = pago;
  for (const p of parcelas) {
    p.pago = Math.min(resto, p.valor); resto -= p.pago;
    p.falta = p.valor - p.pago;
    p.status = p.falta <= 0 ? "pago" : p.venc < hoje ? (p.pago > 0 ? "parcial-atrasada" : "atrasada") : (p.pago > 0 ? "parcial" : "aberta");
  }
  const abertas = parcelas.filter(p => p.falta > 0);
  const vencido = abertas.filter(p => p.venc <= hoje).reduce((s, p) => s + p.falta, 0);
  const prox = abertas[0] || null;
  const visita = c.proximaVisita || (prox ? prox.venc : null);
  const cobrarAgora = vencido || (prox ? prox.falta : 0);
  return { total, pago, saldo, parcelas, abertas, vencido, prox, visita, cobrarAgora };
}
const enderecoLinha = c => [c.rua && (c.rua + (c.numeroCasa ? ", " + c.numeroCasa : "")), c.bairro].filter(Boolean).join(" · ");
const enderecoCompleto = c => [c.rua && (c.rua + (c.numeroCasa ? ", " + c.numeroCasa : "")), c.bairro, c.cidade].filter(Boolean).join(" - ");

/* gera parcelas: cada item é dividido nas vezes escolhidas, a cada "prazo" dias */
function vezesPadrao(cat, cfg) { return cat === "sacolao" ? Math.max(1, Math.min(12, parseInt(cfg.sacolaoParcelas) || 1)) : 1; }
function gerarParcelas(itens, primeiroVenc, cfg) {
  const porData = new Map();
  const prazo = Math.max(1, parseInt(cfg.prazoDias) || 30);
  for (const it of itens) {
    const t = Math.round(it.qtd * it.preco);
    const n = Math.max(1, Math.min(12, parseInt(it.vezes) || vezesPadrao(it.cat, cfg)));
    const base = Math.floor(t / n), sobra = t - base * n;
    for (let i = 0; i < n; i++) { const d = addDays(primeiroVenc, prazo * i); porData.set(d, (porData.get(d) || 0) + base + (i === 0 ? sobra : 0)); }
  }
  return [...porData.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([venc, valor]) => ({ venc, valor })).filter(p => p.valor > 0);
}

const fromRow = r => ({ id: r.id, numero: r.numero, nome: r.nome, telefone: r.telefone, rua: r.rua, numeroCasa: r.numero_casa, bairro: r.bairro, cidade: r.cidade, referencia: r.referencia, obs: r.obs, proximaVisita: r.proxima_visita || "", compras: r.compras || [], pagamentos: r.pagamentos || [], criadoEm: r.criado_em });
const prodRow = p => ({ id: p.id, owner: S.user.id, nome: p.nome, cat: p.cat, preco: p.preco });
// campos simples da ficha: nome no aparelho -> nome no banco

const camposDe = c => Object.fromEntries(Object.entries(CAMPOS).map(([k, col]) => [col, c[k] || ""]));

/* ---------- gravação por operação, com fila (funciona sem internet e envia depois) ----------
   Cada lançamento vira uma operação pequena ("acrescentar este pagamento", "mudar a data da visita").
   Assim, duas pessoas mexendo na mesma ficha não apagam o trabalho uma da outra. */
let outbox = [], flushing = false, inflight = null;
const kOutbox = () => "fichas:outbox:" + S.user.id;
const kCache = () => "fichas:cache:" + S.user.id;
const K_LAST = "fichas:ultimo-usuario";
function saveCache() { ls.set(kCache(), { clientes: [...S.clientes.values()], produtos: S.produtos, profile: S.profile, loja: S.loja, salvoEm: Date.now() }); }
function persistOutbox() { ls.set(kOutbox(), outbox); updateSync(); }

function aplicarOp(op) {
  if (op.t === "prod") {
    S.produtos = S.produtos.filter(p => p.id !== op.id);
    if (op.op !== "del") S.produtos.push({ id: op.row.id, nome: op.row.nome, cat: op.row.cat, preco: op.row.preco });
    return;
  }
  const cur = S.clientes.get(op.cid);
  const set = c => S.clientes.set(op.cid, c);
  switch (op.k) {
    case "cli": {
      if (!cur && !op.criar) return;
      const next = { ...(cur || { id: op.cid, numero: op.numero || 0, compras: [], pagamentos: [], criadoEm: op.campos.criado_em || today() }) };
      for (const [k, col] of Object.entries(CAMPOS)) if (col in op.campos) next[k] = op.campos[col] || "";
      set(next); break;
    }
    case "pag+": if (cur && !(cur.pagamentos || []).some(p => p.id === op.pag.id)) set({ ...cur, pagamentos: [...(cur.pagamentos || []), op.pag] }); break;
    case "pag-": if (cur) set({ ...cur, pagamentos: (cur.pagamentos || []).filter(p => p.id !== op.id) }); break;
    case "venda": if (cur) {
      const has = (cur.compras || []).some(v => v.id === op.venda.id);
      set({ ...cur, compras: has ? cur.compras.map(v => v.id === op.venda.id ? op.venda : v) : [...(cur.compras || []), op.venda] });
    } break;
    case "venda-": if (cur) set({ ...cur, compras: (cur.compras || []).filter(v => v.id !== op.id) }); break;
    case "del": S.clientes.delete(op.cid); break;
  }
}
function applyOutboxLocally() { for (const op of outbox) aplicarOp(op); }
function enviar(op) {
  op = JSON.parse(JSON.stringify(op));
  if (op.t === "prod") outbox = outbox.filter(x => x === inflight || !(x.t === "prod" && x.id === op.id));
  aplicarOp(op); outbox.push(op);
  persistOutbox(); saveCache(); render(); flush();
}
// fila salva por versões antigas do site (ficha inteira) vira operações
function migrarOutbox(arr) {
  const out = [];
  for (const it of arr || []) {
    if (!it) continue;
    if (it.k || it.t === "prod") { out.push(it); continue; }
    if (it.t === "cli" && it.op === "del") { out.push({ k: "del", cid: it.id }); continue; }
    if (it.t === "cli" && it.row) {
      const c = fromRow(it.row);
      out.push({ k: "cli", cid: c.id, criar: true, numero: c.numero, campos: { ...camposDe(c), criado_em: c.criadoEm || today() } });
      for (const v of c.compras) out.push({ k: "venda", cid: c.id, venda: v });
      for (const p of c.pagamentos) out.push({ k: "pag+", cid: c.id, pag: p });
    }
  }
  return out;
}

const isNetErr = e => !navigator.onLine || /fetch|network|timeout|load failed|abort|AuthRetryableFetchError/i.test(String((e && ((e.name || "") + " " + (e.message || e))) || ""));
const isAuthErr = e => /jwt|PGRST301|401|not authenticated/i.test(String((e && ((e.code || "") + " " + (e.message || ""))) || ""));
function executar(op) {
  if (op.t === "prod") return op.op === "del" ? S.sb.from("produtos").delete().eq("id", op.id) : S.sb.from("produtos").upsert(op.row);
  switch (op.k) {
    case "cli": return S.sb.rpc("cliente_salvar", { p_id: op.cid, p_campos: op.campos, p_criar: !!op.criar });
    case "pag+": return S.sb.rpc("pagamento_add", { p_cliente: op.cid, p_pag: op.pag });
    case "pag-": return S.sb.rpc("pagamento_del", { p_cliente: op.cid, p_id: op.id });
    case "venda": return S.sb.rpc("compra_salvar", { p_cliente: op.cid, p_compra: op.venda });
    case "venda-": return S.sb.rpc("compra_del", { p_cliente: op.cid, p_id: op.id });
    case "del": return S.sb.from("clientes").delete().eq("id", op.cid);
  }
  return Promise.resolve({ error: null });
}
async function flush() {
  if (flushing || !S.sb || !S.user || !S.authOk) return;
  flushing = true; updateSync();
  let recusou = false;
  try {
    while (outbox.length) {
      const op = inflight = outbox[0];
      let res;
      try { res = await executar(op); } catch (e) { res = { error: e }; }
      const error = res && res.error;
      if (error && (isNetErr(error) || isAuthErr(error))) break; // tenta de novo mais tarde
      if (error) {
        console.error(error); recusou = true;
        toast(/funcion/i.test(error.message || "") ? error.message : /row-level security|permission/i.test(error.message || "") ? "Seu acesso não permite salvar isso." : "Um lançamento não foi salvo: " + (error.message || "erro"));
      }
      outbox = outbox.filter(x => x !== op); inflight = null; persistOutbox(); opsFeitas++;
      const row = res && res.data && !Array.isArray(res.data) && res.data.id ? res.data : null;
      if (row && !outbox.some(x => x.cid === row.id)) { S.clientes.set(row.id, fromRow(row)); saveCache(); render(true); }
    }
  } finally { flushing = false; inflight = null; updateSync(); }
  if (recusou) sincronizar(); // desfaz no aparelho o que o banco recusou
}
window.addEventListener("online", () => { reconectar(); flush(); });
setInterval(() => { if (outbox.length) flush(); }, 20000);

}

/* ---------- linhas de cliente ---------- */
function clienteRow(c, r, mode) {
  const hoje = today(), v = r.visita;
  let cls = "", right;
  if (mode === "visita") {
    if (v && v < hoje) cls = "late"; else if (v === hoje) cls = "today";
    right = `<div class="val">${money(r.cobrarAgora)}<small>${v ? fmtDate(v) + " · " + relDay(v) : "sem data"}</small></div>`;
  } else {
    if (r.vencido > 0) cls = "late";
    right = `<div class="val">${r.saldo ? money(r.saldo) : '<span class="pill ok">Em dia</span>'}<small>${v && r.saldo ? "visita " + fmtDate(v) : (r.saldo ? "" : "sem saldo")}</small></div>`;
  }
  const end = enderecoLinha(c) || c.telefone || "Sem endereço";
  return `<button class="item" data-action="open" data-id="${esc(c.id)}">
    <div class="fno ${cls}">${String(c.numero || 0).padStart(3, "0")}</div>
    <div class="who"><b>${esc(c.nome)}</b><span>${esc(end)}</span></div>${right}</button>`;
}

/* ---------- tela: Visitas ---------- */
function viewHoje() {
  const hoje = today(), em7 = addDays(hoje, 7);
  const lista = [...S.clientes.values()].map(c => ({ c, r: resumo(c) }));
  const atras = [], hojeL = [], prox = [];
  for (const x of lista) {
    const v = x.r.visita; if (!v) continue;
    if (v < hoje) { if (x.r.saldo > 0) atras.push(x); }
    else if (v === hoje) hojeL.push(x);
    else if (v <= em7) prox.push(x);
  }
  const byDate = (a, b) => a.r.visita.localeCompare(b.r.visita) || a.c.nome.localeCompare(b.c.nome);
  atras.sort(byDate); hojeL.sort(byDate); prox.sort(byDate);
  const mes = hoje.slice(0, 7);
  const aReceber = lista.reduce((s, x) => s + x.r.saldo, 0);
  const vencido = lista.reduce((s, x) => s + x.r.vencido, 0);
  const recebido = lista.reduce((s, x) => s + (x.c.pagamentos || []).filter(p => (p.data || "").startsWith(mes)).reduce((a, p) => a + p.valor, 0), 0);
  const vendido = lista.reduce((s, x) => s + (x.c.compras || []).filter(v => (v.data || "").startsWith(mes)).reduce((a, v) => a + v.total, 0), 0);
  const sec = (titulo, arr, hot, vazio) => `<section class="section">
      <div class="section-h"><h2>${titulo}</h2><span class="count ${hot && arr.length ? "hot" : ""}">${arr.length}</span></div>
      ${arr.length ? `<div class="list">${arr.map(x => clienteRow(x.c, x.r, "visita")).join("")}</div>` : `<p class="muted small" style="margin:0">${vazio}</p>`}
    </section>`;
  const vazio = S.clientes.size === 0 ? `<div class="card empty">
      <h3>Comece passando suas fichas de papel para cá</h3>
      <p>Cada cliente vira uma ficha com endereço, compras, pagamentos e a data de voltar.</p>
      ${ehFunc() ? "" : `<ol class="steps small">
        <li>Cadastre seus produtos e preços em <b>Produtos</b> (opcional, agiliza a venda).</li>
        <li>Adicione o cliente com o endereço.</li>
        <li>Lance a venda: o Sacolão sai em ${S.config.sacolaoParcelas}x e limpeza/casa em ${S.config.prazoDias} dias.</li>
      </ol>`}
      <button class="btn primary" data-action="novo-cliente">${I.plus} Adicionar primeiro cliente</button>
    </div>` : "";
  const diasCopia = diasDesde(ls.get(kCopiaExt())), diasLembrete = diasDesde(ls.get(kLembrete()));
  const lembrete = !ehFunc() && S.clientes.size && (diasCopia === null || diasCopia >= 7) && (diasLembrete === null || diasLembrete >= 3)
    ? `<div class="note" style="display:grid;gap:8px"><span>${diasCopia === null ? "Guarde uma cópia das suas fichas no Google Drive." : `Faz ${diasCopia} dias que você não guarda uma cópia no Drive.`} Leva 10 segundos.</span>
        <div class="row"><button class="btn primary sm" data-action="enviar-copia">Enviar para o Drive</button><button class="btn ghost sm" data-action="lembrete-depois">Depois</button></div></div>` : "";
  return `<div class="today"><div class="eyebrow">${esc(lojaNome())} · ${esc(weekday(hoje))}</div><h1>${esc(longDate(hoje))}</h1></div>
    ${lembrete}
    ${ehFunc() ? "" : `<div class="stats">
      <div class="stat"><span class="eyebrow">A receber</span><b>${money(aReceber)}</b></div>
      <div class="stat hot"><span class="eyebrow">Já vencido</span><b>${money(vencido)}</b></div>
      <div class="stat good"><span class="eyebrow">Recebido em ${esc(monthName())}</span><b>${money(recebido)}</b></div>
      <div class="stat"><span class="eyebrow">Vendido em ${esc(monthName())}</span><b>${money(vendido)}</b></div>
    </div>`}
    ${vazio || `${sec("Atrasadas", atras, true, "Nenhuma cobrança atrasada.")}
      ${sec("Passar hoje", hojeL, false, "Nenhuma visita marcada para hoje.")}
      ${sec("Próximos 7 dias", prox, false, "Nada marcado para a próxima semana.")}
      <div class="row"><button class="btn primary grow" data-action="novo-cliente">${I.plus} Novo cliente</button></div>`}`;
}

/* ---------- tela: Clientes ---------- */
function filtrarClientes() {
  const q = norm(S.busca).trim();
  let arr = [...S.clientes.values()].map(c => ({ c, r: resumo(c) }));
  if (q) arr = arr.filter(({ c }) => norm([c.nome, c.rua, c.bairro, c.cidade, c.telefone, c.numero].join(" ")).includes(q));
  if (S.filtro === "saldo") arr = arr.filter(x => x.r.saldo > 0);
  if (S.filtro === "atrasados") arr = arr.filter(x => x.r.vencido > 0);
  if (S.filtro === "emdia") arr = arr.filter(x => x.r.saldo === 0);
  return arr.sort((a, b) => a.c.nome.localeCompare(b.c.nome, "pt-BR"));
}
function listaClientesHTML() {
  const arr = filtrarClientes();
  if (!S.clientes.size) return `<div class="card empty"><h3>Nenhum cliente ainda</h3><p>Adicione o primeiro cliente para abrir a ficha dele.</p><button class="btn primary" data-action="novo-cliente">${I.plus} Adicionar cliente</button></div>`;
  if (!arr.length) return `<div class="card empty"><p>Nenhum cliente encontrado com essa busca.</p></div>`;
  return `<div class="list">${arr.map(x => clienteRow(x.c, x.r, "lista")).join("")}</div>`;
}
function viewClientes() {
  const f = (k, l) => `<button class="chip" data-action="filtro" data-f="${k}" aria-pressed="${S.filtro === k}">${l}</button>`;
  return `<div class="row"><h1 class="page-h grow">Clientes</h1><button class="btn primary" data-action="novo-cliente">${I.plus} Novo</button></div>
    <input id="busca" class="input" type="search" placeholder="Buscar por nome, rua, bairro ou telefone" value="${esc(S.busca)}" autocomplete="off">
    <div class="chips">${f("todos", "Todos")}${f("saldo", "Com saldo")}${f("atrasados", "Atrasados")}${f("emdia", "Em dia")}</div>
    <div id="lista">${listaClientesHTML()}</div>`;
}

const delBtn = (action, cid, itemId) => `<button class="btn ghost sm" data-action="${action}" data-id="${esc(cid)}" data-item="${esc(itemId)}" aria-label="Excluir">${I.trash}</button>`;

/* ---------- cópias de segurança ---------- */
const kCopiaExt = () => "fichas:copia-externa:" + S.user.id;
const kLembrete = () => "fichas:lembrete-copia:" + S.user.id;
const diasDesde = ts => ts ? Math.floor((Date.now() - ts) / 86400000) : null;
const MOTIVOS = { diaria: "Automática", manual: "Feita por você", "antes de restaurar": "Antes de restaurar" };
function viewBackups() {
  const B = S.backups;
  let lista;
  if (!B) lista = `<p class="small muted" style="margin:0">Carregando…</p>`;
  else if (B.error) lista = `<p class="err-msg" style="margin:0">${esc(B.error)}</p>`;
  else if (!B.list.length) lista = `<p class="small muted" style="margin:0">A primeira cópia automática é feita esta madrugada.</p>`;
  else lista = `<div class="list">${B.list.map(b => {
    const d = new Date(b.criado_em);
    const quando = `${fmtDate(isoOf(d), true)} às ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    return `<div class="item" style="cursor:default;grid-template-columns:minmax(0,1fr) auto">
      <div class="who"><b>${esc(quando)}</b><span>${esc(MOTIVOS[b.motivo] || b.motivo)} · ${b.clientes} cliente${b.clientes === 1 ? "" : "s"}</span></div>
      <div class="row" style="justify-content:flex-end;gap:4px"><button class="btn ghost sm" data-action="bk-baixar" data-id="${b.id}" aria-label="Baixar">${I.dl}</button><button class="btn sm" data-action="bk-restaurar" data-id="${b.id}" data-q="${esc(quando)}">Restaurar</button></div>
    </div>`;
  }).join("")}</div>`;
  const dias = diasDesde(ls.get(kCopiaExt()));
  return `<section class="section">
    <div class="section-h"><h2>Cópias de segurança</h2><span class="grow"></span><button class="btn ghost sm" data-action="bk-reload">Atualizar</button></div>
    <p class="small muted" style="margin:0">Toda madrugada o sistema guarda sozinho uma cópia de todos os clientes, compras e pagamentos, sempre que algo mudou. Ficam as cópias dos últimos 30 dias. Se apagar algo sem querer, toque em <b>Restaurar</b> na cópia do dia certo.</p>
    ${lista}

  S.backups = error ? { error: isNetErr(error) ? "Sem internet. Conecte para ver as cópias." : "Não foi possível carregar: " + error.message } : { list: data || [] };

function arquivoCopia(clientes, produtos, config, quando) {
  return JSON.stringify({ loja: lojaNome(), geradoEm: quando || new Date().toISOString(), clientes, produtos, config }, null, 2);
}
function csvClientes() {
  const q = s => `"${String(s ?? "").replace(/"/g, '""')}"`;
  const brl = c => (c / 100).toFixed(2).replace(".", ",");
  const rows = [["Ficha", "Nome", "Telefone", "Endereço", "Referência", "Comprou", "Pagou", "Saldo", "Vencido", "Próxima visita"].map(q).join(";")];
  for (const c of [...S.clientes.values()].sort((a, b) => (a.numero || 0) - (b.numero || 0))) {
    const r = resumo(c);
    rows.push([c.numero, c.nome, c.telefone, enderecoCompleto(c), c.referencia, brl(r.total), brl(r.pago), brl(r.saldo), brl(r.vencido), r.visita ? fmtDate(r.visita, true) : ""].map(q).join(";"));
  }
  return "\ufeff" + rows.join("\r\n");
}
// abre a tela de compartilhar do celular (Drive, WhatsApp, e-mail); no computador, baixa os arquivos
async function enviarCopia() {
  const st = today();
  const json = arquivoCopia([...S.clientes.values()], S.produtos, S.config);
  const files = [
    new File([json], `copia-fichas-${st}.txt`, { type: "text/plain" }),
    new File([csvClientes()], `clientes-${st}.csv`, { type: "text/csv" }),
  ];
  try {
    if (navigator.canShare && navigator.canShare({ files })) {
      await navigator.share({ files, title: "Cópia das fichas " + fmtDate(st, true) });
      ls.set(kCopiaExt(), Date.now()); toast("Cópia enviada"); render(true); return;
    }
  } catch (e) { if (e && e.name === "AbortError") return; }
  baixar(`copia-fichas-${st}.json`, new Blob([json], { type: "application/json" }));
  ls.set(kCopiaExt(), Date.now()); toast("Arquivo baixado. Guarde no seu Drive."); render(true);
}
async function baixarBackup(id) {
  if (!S.authOk) { toast("Sem internet."); return; }
  const { data, error } = await S.sb.from("backups").select("criado_em,dados").eq("id", id).maybeSingle();
  if (error || !data) { toast("Não foi possível baixar: " + (error ? error.message : "cópia não encontrada")); return; }
  const d = data.dados || {};
  const json = arquivoCopia((d.clientes || []).map(fromRow), d.produtos || [], (d.loja && d.loja.config) || {}, data.criado_em);
  baixar(`copia-fichas-${String(data.criado_em).slice(0, 10)}.json`, new Blob([json], { type: "application/json" }));
}

function formVenda(c, venda) {
  const editando = !!venda;
  const novoItem = () => ({ k: rid(), nome: "", cat: "sacolao", qtd: "1", preco: "", vezes: vezesPadrao("sacolao", S.config), vezesTocado: false });
  const draft = editando ? {
    data: venda.data,
    venc: (venda.parcelas && venda.parcelas[0]) ? venda.parcelas[0].venc : addDays(venda.data, S.config.prazoDias),
    itens: (venda.itens || []).map(it => ({ k: rid(), nome: it.nome, cat: it.cat, qtd: fmtQtd(it.qtd), preco: centsToInput(it.preco), vezes: it.vezes || vezesPadrao(it.cat, S.config), vezesTocado: true })),
  } : { data: today(), venc: addDays(today(), S.config.prazoDias), itens: [novoItem()] };
  if (!draft.itens.length) draft.itens.push(novoItem());
  const opts = S.produtos.map(p => `<option value="${esc(p.nome)}">${esc(CATS[p.cat])} · ${money(p.preco)}</option>`).join("");
  const vezesOpts = sel => Array.from({ length: 12 }, (_, i) => i + 1).map(n => `<option value="${n}" ${+sel === n ? "selected" : ""}>${n}x</option>`).join("");
  openSheet((editando ? "Editar compra · " : "Nova venda · ") + c.nome.split(" ")[0], `
    <datalist id="dl-prod">${opts}</datalist>
    <div class="grid2">
      <div class="field"><label for="v-data">Data da venda</label><input id="v-data" class="input" type="date" value="${draft.data}"></div>
      <div class="field"><label for="v-venc">1º vencimento</label><input id="v-venc" class="input" type="date" value="${draft.venc}"></div>
    </div>
    <div id="v-itens" style="display:grid;gap:8px"></div>
    <div><button type="button" class="btn sm" id="v-add">${I.plus} Adicionar item</button></div>
    <div class="summary" id="v-sum"></div>

    <div class="err-msg" id="v-err" hidden></div>
    <button type="submit" class="btn primary">${editando ? "Salvar alterações" : "Salvar venda na ficha"}</button>
  `, form => {
    const box = form.querySelector("#v-itens"), sum = form.querySelector("#v-sum");
    const subTxt = it => { const t = Math.round(parseQty(it.qtd) * parseMoney(it.preco)); const n = parseInt(it.vezes) || 1; return t ? `${money(t)}${n > 1 ? ` em ${n}x` : " em 1x"}` : money(0); };
    const itemsHTML = () => draft.itens.map(it => `
      <div class="line-item" data-k="${it.k}">
        <div class="li-row">
          <div class="field"><label for="n-${it.k}">Produto</label><input id="n-${it.k}" class="input" list="dl-prod" data-f="nome" value="${esc(it.nome)}" placeholder="Ex.: Sacolão completo" autocomplete="off"></div>
          <div class="field"><label for="c-${it.k}">Tipo</label><select id="c-${it.k}" class="input" data-f="cat">${Object.entries(CATS).map(([k, l]) => `<option value="${k}" ${it.cat === k ? "selected" : ""}>${l}</option>`).join("")}</select></div>
        </div>
        <div class="li-row3">
          <div class="field"><label for="q-${it.k}">Qtd.</label><input id="q-${it.k}" class="input num" inputmode="decimal" data-f="qtd" value="${esc(it.qtd)}"></div>
          <div class="field"><label for="p-${it.k}">Preço unit. (R$)</label><input id="p-${it.k}" class="input num" inputmode="decimal" data-f="preco" value="${esc(it.preco)}" placeholder="0,00"></div>
          <div class="field"><label for="x-${it.k}">Vezes</label><select id="x-${it.k}" class="input num" data-f="vezes">${vezesOpts(it.vezes)}</select></div>
        </div>
        <div class="li-foot"><span class="li-sub" data-sub>${subTxt(it)}</span>${draft.itens.length > 1 ? `<button type="button" class="btn ghost sm" data-rm="${it.k}">${I.trash} Remover</button>` : ""}</div>
      </div>`).join("");
    const parsed = () => draft.itens.map(it => ({ nome: it.nome.trim(), cat: it.cat, qtd: parseQty(it.qtd), preco: parseMoney(it.preco), vezes: Math.max(1, Math.min(12, parseInt(it.vezes) || 1)) })).filter(it => it.nome && it.qtd > 0 && it.preco > 0);
    const updateSum = () => {
      const its = parsed();
      const total = its.reduce((s, it) => s + Math.round(it.qtd * it.preco), 0);
      const venc = draft.venc || addDays(draft.data, S.config.prazoDias);
      const parc = total ? gerarParcelas(its, venc, S.config) : [];
      sum.innerHTML = `<div class="tot"><span>Total</span><span>${money(total)}</span></div>
        ${parc.length ? `<div class="eyebrow" style="margin-top:4px">Vai cobrar</div>${parc.map((p, i) => `<div class="ln"><span>${i + 1}ª · ${fmtDate(p.venc, true)} <span class="muted">(${weekday(p.venc)})</span></span><b>${money(p.valor)}</b></div>`).join("")}` : `<div class="small muted">Preencha produto, quantidade e preço para ver as parcelas.</div>`}`;
    };
    const redraw = () => { box.innerHTML = itemsHTML(); updateSum(); };
    redraw();
    form.querySelector("#v-add").addEventListener("click", () => { draft.itens.push(novoItem()); redraw(); form.querySelector("#n-" + draft.itens[draft.itens.length - 1].k).focus(); });
    box.addEventListener("click", e => { const b = e.target.closest("[data-rm]"); if (!b) return; draft.itens = draft.itens.filter(i => i.k !== b.dataset.rm); redraw(); });
    const onField = e => {
      const el = e.target, li = el.closest(".line-item"); if (!li) return;
      const it = draft.itens.find(i => i.k === li.dataset.k); if (!it) return;
      const f = el.dataset.f; if (!f) return;
      it[f] = el.value;
      const setVezes = v => { it.vezes = v; li.querySelector('[data-f="vezes"]').value = String(v); };
      if (f === "vezes") it.vezesTocado = true;
      if (f === "cat" && !it.vezesTocado) setVezes(vezesPadrao(it.cat, S.config));
      if (f === "nome") {
        const p = S.produtos.find(p => norm(p.nome) === norm(el.value));
        if (p) { it.cat = p.cat; it.preco = centsToInput(p.preco); li.querySelector('[data-f="cat"]').value = p.cat; li.querySelector('[data-f="preco"]').value = it.preco; if (!it.vezesTocado) setVezes(vezesPadrao(p.cat, S.config)); }
      }
      li.querySelector("[data-sub]").textContent = subTxt(it);
      updateSum();
    };
    box.addEventListener("input", onField); box.addEventListener("change", onField);
    form.querySelector("#v-data").addEventListener("change", e => {
      const old = draft.data; draft.data = e.target.value || today();
      if (draft.venc === addDays(old, S.config.prazoDias)) { draft.venc = addDays(draft.data, S.config.prazoDias); form.querySelector("#v-venc").value = draft.venc; }
      updateSum();
    });
    form.querySelector("#v-venc").addEventListener("change", e => { draft.venc = e.target.value; updateSum(); });
    form.addEventListener("submit", e => {
      e.preventDefault();
      const its = parsed(), er = form.querySelector("#v-err");
      if (!its.length) { er.textContent = "Adicione pelo menos um item com produto, quantidade e preço."; er.hidden = false; return; }
      const venc = draft.venc || addDays(draft.data, S.config.prazoDias);
      const total = its.reduce((s, it) => s + Math.round(it.qtd * it.preco), 0);
      const nova = { id: editando ? venda.id : rid(), data: draft.data, itens: its, total, parcelas: gerarParcelas(its, venc, S.config) };
      const cur = S.clientes.get(c.id);
      closeSheet();
      enviar({ k: "venda", cid: c.id, venda: nova });
      if (!cur.proximaVisita || cur.proximaVisita < today()) salvarCampos(c.id, { proxima_visita: nova.parcelas[0].venc });
      toast(editando ? "Compra atualizada" : "Venda de " + money(total) + " lançada");
      if (!editando) setTimeout(() => resumoVenda(S.clientes.get(c.id), nova.id, true), 250);
    });
  });
}

/* Resumo da compra: PDF e texto para o WhatsApp */
const pm = c => money(c).replace(/ /g, " ");
const slug = s => norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "cliente";
function textoResumo(c, v) {
  const r = resumo(c);
  const linhas = [`*${lojaNome()}*`, `Resumo da compra de ${fmtDate(v.data, true)}`, `Cliente: ${c.nome}`, ""];
  for (const it of v.itens || []) linhas.push(`${fmtQtd(it.qtd)} x ${it.nome}: ${pm(Math.round(it.qtd * it.preco))}${(it.vezes || 1) > 1 ? ` (${it.vezes}x)` : ""}`);
  linhas.push("", `*Total: ${pm(v.total)}*`, "", "Parcelas:");
  (v.parcelas || []).forEach((p, i) => linhas.push(`${i + 1}ª ${fmtDate(p.venc, true)}: ${pm(p.valor)}`));
  linhas.push("", `Saldo total da ficha hoje: ${pm(r.saldo)}`);
  return linhas.join("\n");
}
function resumoVenda(c, vendaId, recemLancada) {
  if (!c) return;
  const v = (c.compras || []).find(x => x.id === vendaId); if (!v) return;
  const r = resumo(c);
  const tel = digits(c.telefone), waNum = tel ? (tel.length <= 11 ? "55" + tel : tel) : "";
  const wa = `https://wa.me/${waNum}?text=${encodeURIComponent(textoResumo(c, v))}`;
  openSheet(recemLancada ? "Venda lançada · resumo" : "Resumo da compra", `
    <div class="summary">
      <div class="ln"><b>${esc(c.nome)}</b><span class="muted">${fmtDate(v.data, true)}</span></div>
      ${(v.itens || []).map(it => `<div class="ln"><span>${esc(fmtQtd(it.qtd))} × ${esc(it.nome)}${(it.vezes || 1) > 1 ? ` <span class="muted">(${it.vezes}x)</span>` : ""}</span><span>${money(Math.round(it.qtd * it.preco))}</span></div>`).join("")}
      <div class="tot" style="border-top:1px solid var(--line);padding-top:6px"><span>Total</span><span>${money(v.total)}</span></div>
      <div class="eyebrow" style="margin-top:4px">Parcelas</div>
      ${(v.parcelas || []).map((p, i) => `<div class="ln"><span>${i + 1}ª · ${fmtDate(p.venc, true)}</span><span>${money(p.valor)}</span></div>`).join("")}
      <div class="ln muted" style="border-top:1px solid var(--line);padding-top:6px"><span>Saldo total da ficha hoje</span><b>${money(r.saldo)}</b></div>
    </div>
    <div class="row">
      <button type="button" class="btn primary grow" id="rs-pdf">${I.dl} Baixar PDF</button>
      <a class="btn grow" href="${wa}" target="_blank" rel="noopener">Enviar texto no WhatsApp</a>
    </div>
    <p class="small muted" style="margin:0">Para mandar o PDF: baixe o arquivo e, no WhatsApp do cliente, anexe como documento.</p>
  `, form => {
    form.querySelector("#rs-pdf").addEventListener("click", async e => {
      const b = e.currentTarget; b.disabled = true;
      try { await gerarPDF(c, v); } finally { b.disabled = false; }
    });
  });
}
async function gerarPDF(c, v) {
  const J = window.jspdf && window.jspdf.jsPDF;
  if (!J) { toast("Não foi possível montar o PDF agora. Use o envio por WhatsApp."); return; }
  const r = resumo(c);
  const doc = new J({ unit: "mm", format: "a4" });
  const W = 210, M = 18, GREEN = [30, 59, 46], GOLD = [182, 151, 74], GRAY = [94, 111, 102], LINE = [227, 228, 223];
  doc.setFillColor(...GREEN); doc.rect(0, 0, W, 40, "F");
  doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(20); doc.text(doc.splitTextToSize(lojaNome(), 110), M, 22);
  doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(11);
  doc.text("RESUMO DA COMPRA", W - M, 17, { align: "right" });
  doc.setFont("helvetica", "normal"); doc.setFontSize(10);
  doc.text("Data: " + fmtDate(v.data, true), W - M, 24, { align: "right" });
  doc.text("Ficha " + fichaNo(c.numero), W - M, 30, { align: "right" });
  let y = 54;
  doc.setTextColor(...GREEN); doc.setFont("helvetica", "bold"); doc.setFontSize(17); doc.text(c.nome, M, y);
  doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(...GRAY);
  const end = enderecoCompleto(c);
  if (end) { y += 6; doc.text(doc.splitTextToSize(end, W - 2 * M), M, y); }
  if (c.telefone) { y += 5; doc.text(c.telefone, M, y); }
  y += 10;
  const cQ = M, cP = M + 16, cV = W - M - 38, cT = W - M;
  doc.setDrawColor(...GOLD); doc.setLineWidth(0.7); doc.line(M, y, W - M, y); y += 6;
  doc.setFont("helvetica", "bold"); doc.setFontSize(8.5); doc.setTextColor(...GRAY);
  doc.text("QTD", cQ, y); doc.text("PRODUTO", cP, y); doc.text("VEZES", cV, y, { align: "right" }); doc.text("VALOR", cT, y, { align: "right" });
  y += 3; doc.setDrawColor(...LINE); doc.setLineWidth(0.3); doc.line(M, y, W - M, y); y += 6;
  doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.setTextColor(...GREEN);
  for (const it of v.itens || []) {
    const nome = doc.splitTextToSize(it.nome, cV - cP - 20);
    if (y + nome.length * 5 > 265) { doc.addPage(); y = 20; }
    doc.text(fmtQtd(it.qtd), cQ, y); doc.text(nome, cP, y);
    doc.text((it.vezes || 1) + "x", cV, y, { align: "right" });
    doc.text(pm(Math.round(it.qtd * it.preco)), cT, y, { align: "right" });
    y += nome.length * 5 + 1; doc.line(M, y, W - M, y); y += 6;
  }
  doc.setFont("helvetica", "bold"); doc.setFontSize(14);
  doc.text("Total", cP, y + 1); doc.text(pm(v.total), cT, y + 1, { align: "right" });
  y += 14;
  if (y > 230) { doc.addPage(); y = 20; }
  doc.setFontSize(8.5); doc.setTextColor(...GRAY); doc.text("PARCELAS", M, y); y += 6;
  doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.setTextColor(...GREEN);
  (v.parcelas || []).forEach((p, i) => {
    if (y > 270) { doc.addPage(); y = 20; }
    doc.text(`${i + 1}ª parcela - vence em ${fmtDate(p.venc, true)}`, M, y); doc.text(pm(p.valor), cT, y, { align: "right" }); y += 6.5;
  });
  y += 6;
  if (y > 255) { doc.addPage(); y = 20; }
  doc.setFillColor(245, 245, 243); doc.roundedRect(M, y, W - 2 * M, 20, 3, 3, "F");
  doc.setFontSize(8.5); doc.setFont("helvetica", "bold"); doc.setTextColor(...GRAY);
  doc.text("SITUAÇÃO DA SUA FICHA EM " + fmtDate(today(), true), M + 5, y + 7);
  doc.setFont("helvetica", "normal"); doc.setFontSize(10);
  doc.text(`Comprou ${pm(r.total)}  ·  Pagou ${pm(r.pago)}`, M + 5, y + 14);
  doc.setFont("helvetica", "bold"); doc.setFontSize(13); doc.setTextColor(...GREEN);
  doc.text("Saldo " + pm(r.saldo), W - M - 5, y + 13, { align: "right" });
  doc.setDrawColor(...GOLD); doc.setLineWidth(0.5); doc.line(M, 282, W - M, 282);
  doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(...GRAY);
  doc.text(`${lojaNome()}  ·  emitido em ${fmtDate(today(), true)}`, W / 2, 287, { align: "center" });
  const filename = `compra-${slug(c.nome)}-${v.data}.pdf`;
  baixar(filename, doc.output("blob"));
}

/* ---------- exportar ---------- */
function baixar(filename, blob) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function exportar(kind) {
  const stamp = today();
  if (kind === "csv") baixar(`clientes-${stamp}.csv`, new Blob([csvClientes()], { type: "text/csv;charset=utf-8" }));
  else baixar(`copia-fichas-${stamp}.json`, new Blob([arquivoCopia([...S.clientes.values()], S.produtos, S.config)], { type: "application/json" }));
}

  }
});
app.addEventListener("input", e => {
  if (e.target.id === "busca") { S.busca = e.target.value; const l = document.getElementById("lista"); if (l) l.innerHTML = listaClientesHTML(); }
});
app.addEventListener("submit", async e => {
  const f = e.target;
  if (f.id === "auth-form") { e.preventDefault(); return enviarAuth(f); }
  if (f.id === "rec-form") {
    e.preventDefault();
    const senha = f.querySelector("#r-senha").value, er = f.querySelector("#r-err");
    if (senha.length < 6) { er.textContent = "A senha precisa ter pelo menos 6 caracteres."; er.hidden = false; return; }
    const { error } = await S.sb.auth.updateUser({ password: senha });
    if (error) { er.textContent = traduzErro(error); er.hidden = false; return; }
    toast("Senha alterada"); history.replaceState(null, "", location.pathname); S.mode = "boot"; await carregarPerfil(); return;
  }
  if (f.id === "loja-form") {
    e.preventDefault();
    const parc = Math.max(1, Math.min(12, parseInt(f.querySelector("#cfg-parc").value) || 2));
    const prazo = Math.max(1, Math.min(120, parseInt(f.querySelector("#cfg-prazo").value) || 30));
    const patch = { loja_nome: f.querySelector("#c-loja").value.trim(), telefone: f.querySelector("#c-tel").value.trim(), config: { ...S.config, sacolaoParcelas: parc, prazoDias: prazo, funcVendas: f.querySelector("#cfg-funcvendas").checked } };
    const { error } = await S.sb.from("profiles").update(patch).eq("id", S.user.id);
    if (error) { toast(isNetErr(error) ? "Sem internet. Tente salvar de novo quando conectar." : "Não foi possível salvar: " + error.message); return; }
    S.profile = { ...S.profile, ...patch }; S.loja = S.profile; S.config = { ...DEFAULT_CONFIG, ...patch.config }; saveCache(); render(); toast("Dados da loja salvos");
    return;
  }
  if (f.id === "func-form") {
    e.preventDefault();
    const nome = f.querySelector("#fu-nome").value.trim(), email = f.querySelector("#fu-email").value.trim().toLowerCase();
    const er = f.querySelector("#fu-err"), btn = f.querySelector('[type="submit"]');
    const fail = m => { er.textContent = m; er.hidden = false; btn.disabled = false; };
    if (!nome) return fail("Digite o nome do funcionário.");
    if (!/^\S+@\S+\.\S+$/.test(email)) return fail("Digite um e-mail válido.");
    btn.disabled = true;
    const { data, error } = await S.sb.rpc("funcionario_convidar", { p_email: email, p_nome: nome });
    if (error) return fail(isNetErr(error) ? "Sem internet. Tente de novo quando conectar." : error.message);
    toast(data === "convidado" ? "Cadastrado. Agora ele cria a conta com este e-mail." : "Acesso liberado para " + nome);
    S.equipe = null; render(); carregarEquipe();
  }
});

/* ---------- acesso ---------- */
function traduzErro(e) {
  const m = String((e && e.message) || e || "");
  if (/invalid login/i.test(m)) return "E-mail ou senha incorretos.";
  if (/email not confirmed/i.test(m)) return "Confirme seu e-mail pelo link que enviamos antes de entrar.";
  if (/already registered|already exists/i.test(m)) return "Já existe uma conta com este e-mail. Use \"Entrar\".";
  if (/password/i.test(m) && /6/.test(m)) return "A senha precisa ter pelo menos 6 caracteres.";
  if (/rate limit|too many/i.test(m)) return "Muitas tentativas. Espere alguns minutos e tente de novo.";
  if (isNetErr(e)) return "Sem internet. Confira a conexão e tente de novo.";
  return m || "Algo deu errado. Tente de novo.";
}
async function enviarAuth(f) {
  const er = f.querySelector("#a-err"), ok = f.querySelector("#a-ok"), btn = f.querySelector('[type="submit"]');
  er.hidden = true; ok.hidden = true;
  const email = f.querySelector("#a-email").value.trim().toLowerCase();
  const senhaEl = f.querySelector("#a-senha"), senha = senhaEl ? senhaEl.value : "";
  const fail = m => { er.textContent = m; er.hidden = false; btn.disabled = false; };
  if (!/^\S+@\S+\.\S+$/.test(email)) return fail("Digite um e-mail válido.");
  const back = location.origin + location.pathname;
  btn.disabled = true;
  if (S.authTab === "esqueci") {
    const { error } = await S.sb.auth.resetPasswordForEmail(email, { redirectTo: back });
    if (error) return fail(traduzErro(error));
    ok.textContent = "Pronto. Abra o link que enviamos para " + email + "."; ok.hidden = false; btn.disabled = false; return;
  }
  if (senha.length < 6) return fail("A senha precisa ter pelo menos 6 caracteres.");
  if (S.authTab === "entrar") {
    const { error } = await S.sb.auth.signInWithPassword({ email, password: senha });
    if (error) return fail(traduzErro(error));
    return; // onAuthStateChange continua
  }
  let meta;
  if (S.souFunc) {
    const nome = f.querySelector("#a-nome").value.trim();
    if (!nome) return fail("Digite o seu nome.");
    meta = { nome, funcionario: true };
  } else {
    const loja = f.querySelector("#a-loja").value.trim();
    if (!loja) return fail("Digite o nome da sua loja.");
    meta = { loja_nome: loja, telefone: f.querySelector("#a-tel").value.trim() };
  }
  const { data, error } = await S.sb.auth.signUp({ email, password: senha, options: { emailRedirectTo: back, data: meta } });
  if (error) return fail(traduzErro(error));
  if (!data.session) { ok.textContent = "Conta criada. Enviamos um link de confirmação para " + email + ". Depois de confirmar, volte aqui e entre."; ok.hidden = false; btn.disabled = false; }
}
async function sair() {
  if (outbox.length && S.authOk) await flush();
  if (outbox.length && !confirm(`Ainda há ${outbox.length} lançamento(s) que não foram enviados por falta de internet. Eles ficam guardados neste aparelho e são enviados quando você entrar de novo com esta conta. Sair mesmo assim?`)) return;
  ls.del(K_LAST);
  if (S.user) { ls.del(kCache()); if (!outbox.length) ls.del(kOutbox()); }
  await S.sb.auth.signOut({ scope: "local" }).catch(() => {});
  sairLocal();
}
function sairLocal() {
  S.user = null; S.authOk = false; S.mode = "auth"; S.authTab = "entrar";
  S.clientes = new Map(); S.produtos = []; S.profile = null; S.loja = null; S.admin = null; S.equipe = null; outbox = [];
  closeSheet(); render();
}
function erroConta(msg) {
  S.mode = "auth"; tabsEl.hidden = true; updateSync();
  app.innerHTML = `<div class="auth"><div class="card empty"><h3>Não foi possível abrir sua conta</h3><p>${esc(msg)}</p><div class="row" style="justify-content:center"><button class="btn" data-act="verificar">Tentar de novo</button><button class="btn" data-act="sair">Sair</button></div></div></div>`;
}

/* perfil: a própria conta e, se for funcionário, a loja a que pertence */
function aplicarPerfil(prof, loja) {
  S.profile = prof;
  S.loja = prof.loja ? (loja || (S.loja && S.loja.id === prof.loja ? S.loja : null)) : prof;
  S.config = { ...DEFAULT_CONFIG, ...((S.loja && S.loja.config) || prof.config || {}) };
  if (prof.status !== "ativo") S.mode = prof.status === "bloqueado" ? "bloqueado" : "pendente";
  else if (prof.loja && S.loja && S.loja.status && S.loja.status !== "ativo") S.mode = "bloqueado";
  else S.mode = "app";
}

// abre na hora com a cópia guardada no aparelho; depois atualiza pela internet
async function carregarPerfil() {
  if (!S.user || S.mode === "recovery") return;
  const cache = ls.get(kCache());
  outbox = migrarOutbox(ls.get(kOutbox()) || []); ls.set(kOutbox(), outbox);
  S.clientes = new Map(); S.produtos = []; S.equipe = null; S.admin = null; S.backups = null; S.ultimaSync = 0;
  if (cache && cache.profile) {
    aplicarPerfil(cache.profile, cache.loja);
    if (S.mode === "app") {
      S.clientes = new Map((cache.clientes || []).map(c => [c.id, c]));
      S.produtos = cache.produtos || [];
      applyOutboxLocally();
    }
    render();
  } else if (!S.authOk) {
    S.mode = "auth"; tabsEl.hidden = true; updateSync();
    app.innerHTML = `<div class="auth"><div class="card empty"><h3>Sem internet</h3><p>Abra o sistema uma vez com internet para baixar suas fichas para este aparelho. Depois ele funciona sem internet.</p></div></div>`;
    return;
  }
  if (S.authOk) await sincronizar();
}

let sincronizando = null, opsFeitas = 0;
function sincronizar() {
  if (!sincronizando) sincronizando = _sincronizar().catch(e => console.error(e)).finally(() => { sincronizando = null; });
  return sincronizando;
}
async function _sincronizar() {
  if (!S.user || !S.authOk || S.mode === "recovery") return;
  const feitasAntes = opsFeitas, antes = S.mode;
  const { data: prof, error } = await S.sb.from("profiles").select("*").eq("id", S.user.id).maybeSingle();
  if (error) {
    if (isNetErr(error) || isAuthErr(error)) {
      if (S.mode === "boot") erroConta("Sem internet. Confira a conexão e toque em Tentar de novo.");
      else if (antes !== "app") toast("Sem internet. Tente de novo quando conectar.");
      return;
    }
    if (antes !== "app") erroConta(traduzErro(error)); return;
  }
  if (!prof) { erroConta("Perfil não encontrado. Fale com o suporte."); return; }
  let loja = null;
  if (prof.loja) {
    const r = await S.sb.from("profiles").select("id,loja_nome,telefone,config,status").eq("id", prof.loja).maybeSingle();
    if (r.error) return;
    loja = r.data || { id: prof.loja, status: "bloqueado" };
  }
  if (S.mode === "recovery") return;
  aplicarPerfil(prof, loja);
  if (S.mode !== "app") { saveCache(); render(); return; }
  const [cl, pr] = await Promise.all([
    S.sb.from("clientes").select("*").order("nome"),
    S.sb.from("produtos").select("id,nome,cat,preco").order("nome"),
  ]);
  if (cl.error || pr.error) {
    const e = cl.error || pr.error;
    if (antes !== "app") render();
    if (!isNetErr(e)) toast("Erro ao carregar: " + e.message);
    return;
  }
  S.clientes = new Map(cl.data.map(r => [r.id, fromRow(r)]));
  S.produtos = pr.data;
  applyOutboxLocally();
  saveCache(); S.ultimaSync = Date.now();
  render(antes === "app");
  if (opsFeitas !== feitasAntes) setTimeout(sincronizar, 300); // algo foi gravado enquanto baixava
  flush();
}

/* ---------- sessão (entra sem internet com a última conta usada no aparelho) ---------- */
const comTempo = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
const fetchComTempo = (url, opts = {}) => {
  const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), 20000);
  if (opts.signal) opts.signal.addEventListener("abort", () => ctrl.abort());
  return fetch(url, { ...opts, signal: ctrl.signal }).finally(() => clearTimeout(t));
};
function entrarUsuario(user, autenticado) {
  const mudou = user.id !== (S.user && S.user.id);
  S.user = user;
  if (autenticado) { S.authOk = true; ls.set(K_LAST, { id: user.id, email: user.email, user_metadata: user.user_metadata || {} }); }
  if (S.mode === "recovery") return;
  if (mudou) { carregarPerfil(); return; }
  if (autenticado) { flush(); if (Date.now() - S.ultimaSync > 30000) sincronizar(); }
  updateSync();
}
let reconectando = false;
async function reconectar() {
  if (reconectando || !S.sb || !S.user || S.authOk) return;
  reconectando = true;
  try {
    const { data } = await comTempo(S.sb.auth.getSession(), 8000);
    if (data && data.session) entrarUsuario(data.session.user, true);
  } catch (_) {} finally { reconectando = false; }
}
setInterval(() => { if (S.user && !S.authOk && navigator.onLine) reconectar(); }, 30000);

async function start() {
  if (!window.supabase || !CFG.supabaseUrl || !CFG.supabaseKey) {
    app.innerHTML = `<div class="auth"><div class="card empty"><h3>Sistema ainda não configurado</h3><p>Preencha o arquivo config.js com o endereço e a chave do Supabase.</p></div></div>`;
    return;
  }
  S.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
    global: { fetch: fetchComTempo },
  });
  S.sb.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY") { S.user = session.user; S.authOk = true; S.mode = "recovery"; render(); return; }
    if (session) { setTimeout(() => entrarUsuario(session.user, true), 0); return; }
    if (event === "SIGNED_OUT") setTimeout(sairLocal, 0);
  });
  let sess = null, err = null;
  try { const r = await comTempo(S.sb.auth.getSession(), 8000); sess = r.data && r.data.session; err = r.error; } catch (e) { err = e; }
  if (sess) { entrarUsuario(sess.user, true); }
  else {
    const last = ls.get(K_LAST);
    if (last && last.id && (err || !navigator.onLine)) entrarUsuario(last, false);
    else if (S.mode === "boot") { S.mode = "auth"; render(); }
  }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden || !S.user) return;
    if (!S.authOk) { reconectar(); return; }
    flush();
    if (S.mode === "app" && !outbox.length && Date.now() - S.ultimaSync > 60000) sincronizar();
  });
}
start();
// guarda o sistema no aparelho para abrir sem internet
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(e => console.warn("sw", e)));
})();
</script>
